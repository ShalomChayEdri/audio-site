<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Stream</title>
  <style>
    body {
      font-family: sans-serif;
      background: #ffffff;
      color: #000;
      padding: 10px;
    }
    .container {
      max-width: 260px;
      margin: 0 auto;
      text-align: center;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Simple Audio Stream</h3>
    <p>Optimized for Opera Mini on feature phones.</p>

    <audio id="player" controls preload="none">
      <!-- Replace this URL with your actual audio stream link -->
      <source src="ep1.mp3" type="audio/mpeg" />
      Your browser does not support audio playback.
    </audio>
  </div>
</body>
</html>
